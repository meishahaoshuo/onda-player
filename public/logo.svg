<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4C595"/>
      <stop offset="0.55" stop-color="#E8956B"/>
      <stop offset="1" stop-color="#D9704F"/>
    </linearGradient>
    <linearGradient id="inner" x1="24" y1="6" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 暖色渐变圆角底 -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#bg)"/>
  <!-- 顶部内高光（玻璃感） -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#inner)"/>

  <!-- 音符圆点 -->
  <circle cx="13.5" cy="24" r="4.6" fill="#FFF8EF"/>

  <!-- 三行流动声波（旋律向右流淌，透明度递减） -->
  <path d="M21.5 15.5 q 3.5 -5 7 0 t 7 0" fill="none" stroke="#FFF8EF" stroke-width="3.8" stroke-linecap="round" opacity="1"/>
  <path d="M21.5 24 q 3.5 -5 7 0 t 7 0 t 7 0" fill="none" stroke="#FFF8EF" stroke-width="3.8" stroke-linecap="round" opacity="0.78"/>
  <path d="M21.5 32.5 q 3.5 -5 7 0 t 7 0" fill="none" stroke="#FFF8EF" stroke-width="3.8" stroke-linecap="round" opacity="0.5"/>
</svg>
