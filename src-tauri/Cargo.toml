[package]
name = "app"
version = "1.0.0"
description = "Onda Player - 本地音乐播放器"
authors = ["Onda Player"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
urlencoding = "2"

# release 构建：LTO 跨 crate 内联 + 单 codegen 单元 → 产物更小、启动略快；
# strip 去掉符号表（只影响崩溃栈可读性，不影响运行）。代价是编译时间明显变长。
[profile.release]
lto = true
codegen-units = 1
strip = true
